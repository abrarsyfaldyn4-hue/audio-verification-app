workflows:
  flutter-debug:
    name: Flutter Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Ensure Flutter project structure
        script: |
          if [ ! -f pubspec.yaml ]; then
            echo "Missing pubspec.yaml at repository root" >&2
            exit 1
          fi

          if [ ! -d android ]; then
            echo "Android folder missing; creating Flutter Android platform..."
            flutter create . --platforms=android --project-name audio_verification_app
          fi

          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "AndroidManifest.xml missing; recreating Android platform..."
            flutter create . --platforms=android --overwrite --project-name audio_verification_app
          fi

      - name: Patch Android permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          if not p.exists():
              raise SystemExit('AndroidManifest.xml still missing after flutter create')
          text = p.read_text()
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application'
              )
          p.write_text(text)
          PY

      - name: Get packages
        script: flutter pub get

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
