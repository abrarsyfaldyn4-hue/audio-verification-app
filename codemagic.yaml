workflows:
  flutter-debug:
    name: Flutter Debug APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Ensure full Flutter project structure
        script: |
          mkdir -p /tmp/bak
          cp -r lib /tmp/bak/lib
          cp pubspec.yaml /tmp/bak/pubspec.yaml
          rm -f .metadata
          flutter create . --platforms=android --project-name audio_verification_app
          cp -r /tmp/bak/lib/. lib/
          cp /tmp/bak/pubspec.yaml pubspec.yaml
          python3 - <<'PY'
          import glob
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'RECORD_AUDIO' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application android:usesCleartextTraffic="true"', 1)
          open(p, 'w').write(s)
          for f in glob.glob('android/app/build.gradle*'):
              t = open(f).read()
              t = t.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23').replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              open(f, 'w').write(t)
          PY
      - name: Get packages
        script: flutter pub get

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
      - build/app/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - $PERSONAL_EMAIL
        notify:
          success: true
          failure: true

  flutter-release:
    name: Flutter Release APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Ensure full Flutter project structure
        script: |
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found at project root"
            exit 1
          fi
          
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Flutter Android project incomplete. Recreating..."
            rm -rf android
            flutter create . --platforms=android --org com.example
          fi
          
          echo "Project structure verified"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/release/app-release.apk
      - build/app/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - $PERSONAL_EMAIL
        notify:
          success: true
          failure: true

  flutter-aab:
    name: Flutter App Bundle
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Ensure full Flutter project structure
        script: |
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found at project root"
            exit 1
          fi
          
          if [ ! -f android/settings.gradle ] || [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            echo "Flutter Android project incomplete. Recreating..."
            rm -rf android
            flutter create . --platforms=android --org com.example
          fi
          
          echo "Project structure verified"

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build App Bundle
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - $PERSONAL_EMAIL
        notify:
          success: true
          failure: true
